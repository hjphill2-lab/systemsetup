<!DOCTYPE html>
<html>
<head>
    <title>My Progress</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Assignment Progress</h1>

    <p>{{ completed }} of {{ total }} assignments completed ({{ percent }}%)</p>

    <div style="border: 1px solid #333; width: 300px; height: 20px;">
        <div style="background-color: #4caf50; width: {{ percent }}%; height: 100%;"></div>
    </div>

    <h2>By Course</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>Course</th>
            <th>Completed</th>
            <th>Total</th>
        </tr>
        {% for course in by_course %}
        <tr>
            <td>{{ course[0] }}</td>
            <td>{{ course[2] }}</td>
            <td>{{ course[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/home">Back to Home</a>
</body>
</html>
