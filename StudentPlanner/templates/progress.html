<!DOCTYPE html>
<html>
<head>
    <title>My Progress</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h1>Assignment Progress</h1>

    <p>{{ completed }} of {{ total }} assignments completed ({{ percent }}%)</p>

    <div class="progress-track">
        <div class="progress-fill" style="width: {{ percent }}%;"></div>
    </div>

    <h2>By Course</h2>
    <table>
        <tr>
            <th>Course</th>
            <th>Completed</th>
            <th>Total</th>
        </tr>
        {% for course in by_course %}
        <tr>
            <td>{{ course[0] }}</td>
            <td>{{ course[2] }}</td>
            <td>{{ course[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/home">Back to Home</a>
</div>
</body>
</html>
