<!DOCTYPE html>
<html>
<head>
    <title>My Assignments</title>
    <link rel="stylesheet" href ="/static/style.css">
</head>
<body>
<div class="container">
    <h1>My Assignments</h1>
    <a href="/assignments">View My Assignments</a>
    <table>
        <tr>
            <th>Course</th>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Completed</th>
            <th>Actions</th>
        </tr>
        {% for assignment in assignments %}
        <tr>
            <td>{{ assignment[2] }}</td>
            <td>{{ assignment[3] }}</td>
            <td>{{ assignment[4] }}</td>
            <td>{{ assignment[5] }}</td>
            <td>
                {% if assignment[6] %}
                Yes
                {% else %}
                <a href="/complete_assignment/{{ assignment[0] }}">Mark Complete</a>
                {% endif %}
            </td>
            <td>
                <form
                    action="{{ url_for('delete_assignment', assignment_id=assignment[0]) }}"
                    method="post"
                    onsubmit="return confirm('Do you want to delete this assignment?')">
                    <button type="submit" class="button">Delete</button>
                </form>
                <a href="{{ url_for('edit_assignment', assignment_id=assignment[0]) }}">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <a href="/home">Back to Home</a>
</div>
</body>
</html>
