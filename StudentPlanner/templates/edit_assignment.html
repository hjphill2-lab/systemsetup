<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Assignment</title>
    <link rel="stylesheet" href ="/static/style.css">
</head>
<body>
<div class="container">
    <h1>Edit an Existing Assignment</h1>
    <form  action="{{ url_for('edit_assignment', assignment_id=assignment['AssignmentID']) }}" method="POST">
        <label for="CourseName">Edit Course Name:</label>
        <input type="text" id="CourseName" name="CourseName" value="{{ assignment['CourseName'] }}" required>
        <br><br>
        <label for="Title">Edit Assignment Name:</label>
        <input type="text" id="Title" name="Title" value="{{ assignment['Title'] }}" required>
        <br><br>
        <label for="Description">Edit Description:</label>
        <textarea id="Description" name="Description">{{ assignment['Description'] or '' }}</textarea>
        <br><br>
        <label for="DueDate">Edit Due Date:</label>
        <input type="date" id="DueDate" name="DueDate" value="{{ assignment['DueDate'] }}" required>
        <br><br>
        <label for="Completed">Completed:</label>
        <input type="checkbox" id="Completed" name="Completed" {% if assignment['Completed'] %}checked{% endif %}>
        <br><br>
        <button type="submit">Edit Assignment</button>
        <br><br>
        <a href="/home">Cancel</a>
    </form>
</div>
</body>
</html>
